    <header class="py-5 bg-light-gradient border-bottom">
      <div class="container">
        <h1 class="fw-bold text-black mb-1 reveal">Contact Me</h1>
        <p class="text-secondary lead reveal" style="--delay:.1s;">Get in touch via email or the form below.</p>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <div class="row g-5">
          <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm reveal">
              <div class="card-body">
                <h5 class="mb-3">Send a message</h5>
                <form action="#" method="post" novalidate>
                  <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Your name" required>
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="Subject" required>
                  </div>
                  <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" rows="5" placeholder="Write your message..." required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Send</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <div class="p-4 border rounded-3 reveal">
              <h5 class="mb-3">Contact details</h5>
              <p class="mb-1"><i class="bi bi-envelope me-2 text-primary"></i><a class="list-group-item" href="mailto:Rotimi.lawuyi@gmail.com">Rotimi.lawuyi@gmail.com</a></p>
              <p class="mb-1"><i class="bi bi-geo-alt me-2 text-primary"></i>Lagos, Nigeria</p>
              <div class="d-flex gap-3 mt-3">
